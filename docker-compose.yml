services:
  app:
    image: oven/bun:latest
    working_dir: /app
    volumes:
      # Mount the project from the host, including node_modules installed with Bun
      - .:/app
    # VITE_* vars are read by Vite from the mounted .env / .env.local files.
    # Do not set them here: compose only substitutes from .env (not .env.local),
    # and container env vars override Vite's file-based loading.
    # Dev mode with Bun + Vite, binding to all interfaces.
    # Assumes you've already run `bun install` on the host.
    command: sh -c "bun run dev -- --host 0.0.0.0 --port 5173"
    ports:
      - "5173:5173"
    depends_on:
      - surrealdb
      - printer
      - payment
      - sync
      - tracking
      - api
      - gateway

  surrealdb:
    image: surrealdb/surrealdb:v3.0.5
    # SURREAL_USER/SURREAL_PASS must be set in .env — no default, so a fresh
    # `docker compose up` fails loudly instead of starting with a known
    # root/root credential reachable on the published port below.
    working_dir: /
    user: "0:0"
    command: >
      start --user ${SURREAL_USER:?Set SURREAL_USER in .env} --pass ${SURREAL_PASS:?Set SURREAL_PASS in .env} surrealkv://database --bind 0.0.0.0:8000
    ports:
      - "8000:8000"
    volumes:
      # Host /database -> container /database (surrealkv://database resolves to ./database = /database)
      - ./database:/database

  printer:
    build:
      context: ./printing
      dockerfile: Dockerfile
    image: posr-react-printer:latest
    working_dir: /app
    volumes:
      - ./printing:/app
      - printer-node_modules:/app/node_modules
    environment:
      - PRINT_PORT=3132
      - PRINT_HOST=0.0.0.0
      - TZ=${VITE_APP_TIMEZONE:-UTC}
      - GATEWAY_JWT_SECRET=${GATEWAY_JWT_SECRET:?Set a long random value in .env}
      - GATEWAY_ALLOWED_ORIGINS=${GATEWAY_ALLOWED_ORIGINS:-http://localhost:5173}
    command: sh -c "npm install && node server.js"
    ports:
      - "3132:3132"
    # USB access for local USB printers
    devices:
      - /dev/bus/usb:/dev/bus/usb

  payment:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./payments:/app
      - payment-node_modules:/app/node_modules
    env_file:
      - ./payments/.env
    environment:
      - PAYMENT_PORT=3134
      - PAYMENT_HOST=0.0.0.0
      - PAYMENT_BASE_URL=${VITE_PAYMENT_SERVER_URL:-http://localhost:3134}
      - SURREAL_URL=ws://surrealdb:8000/rpc
      - SURREAL_NS=posr
      - SURREAL_DB=posr
      - SURREAL_USER=${SURREAL_USER:?Set SURREAL_USER in .env}
      - SURREAL_PASS=${SURREAL_PASS:?Set SURREAL_PASS in .env}
      - PAYMENT_LOG_LEVEL=debug
      - GATEWAY_JWT_SECRET=${GATEWAY_JWT_SECRET:?Set a long random value in .env}
      - PAYMENT_ALLOWED_ORIGINS=${PAYMENT_ALLOWED_ORIGINS:-http://localhost:5173}
    command: sh -c "npm install && node server.js"
    ports:
      - "3134:3134"
    depends_on:
      - surrealdb
      - gateway

  sync:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./sync-service:/app
      - sync-node_modules:/app/node_modules
    environment:
      - SYNC_SERVICE_PORT=3136
      - SYNC_SERVICE_HOST=0.0.0.0
      - SYNC_RECONNECT_MS=5000
      - SYNC_LOG_LEVEL=info
      - SYNC_CLIENT_ID=${SYNC_CLIENT_ID:-client-001}
      - SYNC_SOURCE_URL=${SYNC_SOURCE_URL:-ws://surrealdb:8000/rpc}
      - SYNC_SOURCE_NS=${SYNC_SOURCE_NS:-posr}
      - SYNC_SOURCE_DB=${SYNC_SOURCE_DB:-posr}
      # SYNC_SOURCE_* points at this compose's own surrealdb (the "source" of
      # this branch's changes), so it always reuses SURREAL_USER/SURREAL_PASS
      # rather than needing its own separate credential in .env.
      - SYNC_SOURCE_USER=${SURREAL_USER:?Set SURREAL_USER in .env}
      - SYNC_SOURCE_PASS=${SURREAL_PASS:?Set SURREAL_PASS in .env}
      - SYNC_EXCLUDE_TABLES=${SYNC_EXCLUDE_TABLES:-}
      # SYNC_MASTER_* come from sync-service/.env or .env.local (dotenv).
      # Do not set SYNC_MASTER_URL=${SYNC_MASTER_URL:-} here — an empty value
      # disables sync even when .env.local has a real URL.
    command: sh -c "npm install && node server.js"
    ports:
      - "3136:3136"
    depends_on:
      - surrealdb
    restart: unless-stopped

  tracking:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./tracking-api:/app
      - tracking-api-node_modules:/app/node_modules
    environment:
      - TRACKING_PORT=3138
      - TRACKING_HOST=0.0.0.0
      - TRACKING_DB_URL=ws://surrealdb:8000/rpc
      - TRACKING_DB_NS=posr
      - TRACKING_DB_NAME=posr
      - TRACKING_DB_USER=${SURREAL_USER:?Set SURREAL_USER in .env}
      - TRACKING_DB_PASS=${SURREAL_PASS:?Set SURREAL_PASS in .env}
      - GATEWAY_JWT_SECRET=${GATEWAY_JWT_SECRET:?Set a long random value in .env}
      - GATEWAY_ALLOWED_ORIGINS=${GATEWAY_ALLOWED_ORIGINS:-http://localhost:5173}
    command: sh -c "npm install && npm start"
    ports:
      - "3138:3138"
    depends_on:
      - surrealdb
      - gateway

  api:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./api:/app
      - api-node_modules:/app/node_modules
    env_file:
      - ./api/.env
    environment:
      - API_PORT=3140
      - API_HOST=0.0.0.0
      - API_LOG_LEVEL=info
      - API_ALLOWED_ORIGINS=${API_ALLOWED_ORIGINS:-http://localhost:5173}
      - GATEWAY_JWT_SECRET=${GATEWAY_JWT_SECRET:?Set a long random value in .env}
      - AI_ENABLED=${AI_ENABLED:-false}
      - AI_DAILY_LIMIT=${AI_DAILY_LIMIT:-}
      - AI_MONTHLY_LIMIT=${AI_MONTHLY_LIMIT:-}
      - SURREAL_URL=ws://surrealdb:8000/rpc
      - SURREAL_USER=${SURREAL_USER:?Set SURREAL_USER in .env}
      - SURREAL_PASS=${SURREAL_PASS:?Set SURREAL_PASS in .env}
    command: sh -c "npm install && node server.js"
    ports:
      - "3140:3140"
    depends_on:
      - gateway
    restart: unless-stopped

  gateway:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./gateway:/app
      - gateway-node_modules:/app/node_modules
    environment:
      - GATEWAY_HOST=0.0.0.0
      - GATEWAY_PORT=3142
      - GATEWAY_JWT_SECRET=${GATEWAY_JWT_SECRET:?Set a long random value in .env}
      - GATEWAY_JWT_TTL=${GATEWAY_JWT_TTL:-12h}
      - GATEWAY_ALLOWED_ORIGINS=${GATEWAY_ALLOWED_ORIGINS:-http://localhost:5173}
      - SURREAL_URL=ws://surrealdb:8000/rpc
      - SURREAL_NS=posr
      - SURREAL_DB=posr
      - SURREAL_USER=${SURREAL_USER:?Set SURREAL_USER in .env}
      - SURREAL_PASS=${SURREAL_PASS:?Set SURREAL_PASS in .env}
    command: sh -c "npm install && node server.js"
    ports:
      - "3142:3142"
    depends_on:
      - surrealdb

  backup:
    image: docker:27-cli
    working_dir: /backup
    volumes:
      - ./backups/surrealdb:/backups
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      # Timezone for cron schedule (change if you need local time)
      - TZ=UTC
      # SurrealDB auth + target namespace/database for export
      - SURREAL_USER=${SURREAL_USER:?Set SURREAL_USER in .env}
      - SURREAL_PASS=${SURREAL_PASS:?Set SURREAL_PASS in .env}
      - SURREAL_NAMESPACE=posr
      - SURREAL_DATABASE=posr
      # Endpoint used from inside the surrealdb container
      - SURREAL_ENDPOINT=http://127.0.0.1:8000
      # Keep only the latest N backup files
      - BACKUP_RETENTION_COUNT=7
    depends_on:
      - surrealdb
    command: >
      sh -c '
        set -eu;
        mkdir -p /backups;
        printf "%s\n" \
          "#!/bin/sh" \
          "set -eu" \
          "mkdir -p /backups" \
          "retention=\$${BACKUP_RETENTION_COUNT:-7}" \
          "ts=\$$(date -u +%Y%m%dT%H%M%SZ)" \
          "file=/backups/surrealdb-\$${ts}.surql" \
          "project=\$${COMPOSE_PROJECT_NAME:-posr-react}" \
          "db_container=\$${SURREAL_CONTAINER_NAME:-}" \
          "if [ -z \"\$$db_container\" ]; then db_container=\$$(docker ps --filter \"label=com.docker.compose.project=\$$project\" --filter \"label=com.docker.compose.service=surrealdb\" --format \"{{.Names}}\" | awk \"NR==1{print; exit}\"); fi" \
          "if [ -z \"\$$db_container\" ]; then echo \"No surrealdb container found\" >&2; exit 1; fi" \
          "if docker exec \"\$$db_container\" /surreal --log none export --endpoint \"\$${SURREAL_ENDPOINT:-http://127.0.0.1:8000}\" --username \"\$${SURREAL_USER:-root}\" --password \"\$${SURREAL_PASS:-root}\" --namespace \"\$${SURREAL_NAMESPACE:-posr}\" --database \"\$${SURREAL_DATABASE:-posr}\" - > \"\$$file\"; then echo \"Created backup: \$$file\"; else rm -f \"\$$file\"; echo \"Backup export failed\" >&2; exit 1; fi" \
          "ls -1t /backups/surrealdb-*.surql 2>/dev/null | sed -n \"\$$((retention+1)),\\\$$p\" | xargs -r rm -f" \
          > /usr/local/bin/run-backup.sh;
        chmod +x /usr/local/bin/run-backup.sh;
        {
          echo "0 0 * * * /usr/local/bin/run-backup.sh";
          echo "0 12 * * * /usr/local/bin/run-backup.sh";
        } > /etc/crontabs/root;
        crond -f -l 8 -L /dev/stdout
      '
    restart: unless-stopped

volumes:
  printer-node_modules:
  payment-node_modules:
  sync-node_modules:
  tracking-api-node_modules:
  api-node_modules:
  gateway-node_modules:

