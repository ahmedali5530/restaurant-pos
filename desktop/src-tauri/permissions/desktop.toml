[[permission]]
identifier = "desktop-commands"
description = "Allow desktop setup / SurrealQL import / logs / runtime config commands"
commands.allow = [
  "desktop_status",
  "mark_setup_complete",
  "import_surql",
  "pick_surql_files",
  "open_migrations_folder",
  "get_service_status",
  "get_log_tail",
  "open_logs_dir",
  "clear_logs",
  "get_runtime_config"
]
